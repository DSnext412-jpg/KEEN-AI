kind = "web"
previewPath = "/"
title = "KEEN AI"
version = "1.0.0"
id = "artifacts/keen-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18498

[services.development]
run = "pnpm --filter @workspace/keen-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/keen-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/keen-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18498"
BASE_PATH = "/"
